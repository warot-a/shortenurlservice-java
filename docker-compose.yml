version: "3.8"

services:
  mongodb:
    image: mongo:8
    container_name: shorturl_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password1234
      MONGO_INITDB_DATABASE: short_url_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - shorturl-network

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://admin:password1234@mongodb:27017/
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: express
      ME_CONFIG_BASICAUTH_PASSWORD: password1234
    networks:
      - shorturl-network

  redis:
    image: redis:8-alpine
    container_name: shorturl_redis
    ports:
      - "6379:6379"
    networks:
      - shorturl-network

  # Short URL Service Application
  app:
    build: .
    container_name: shorturl_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MONGODB_URI=mongodb://admin:password1234@mongodb:27017/short_url_db?authSource=admin
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - APP_DOMAIN_BASE_URL=http://localhost:8080
    depends_on:
      - mongodb
      - redis
    networks:
      - shorturl-network

networks:
  shorturl-network:
    driver: bridge

volumes:
  mongodb_data:
